name: Build ready-to-open Mac downloads
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-downloads
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.label }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: AppleSilicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.22.3
      - name: Build and offline startup-test
        run: python packaging/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ matrix.label }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mac-*
          path: release
          merge-multiple: true
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          gh release create "v$version" release/*.zip release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Keep Your E3200 v$version — Mac preview" --notes-file packaging/RELEASE_NOTES.md --latest
