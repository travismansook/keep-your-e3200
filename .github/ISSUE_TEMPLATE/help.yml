name: Get help
description: Report a problem with the combined helper
body:
  - type: markdown
    attributes:
      value: Please read the Mac or Linux/Pi setup guide and FAQ first. Remove private addresses, device IDs, passwords and serial numbers from anything you share.
  - type: dropdown
    id: platform
    attributes:
      label: Which download are you using?
      options:
        - Mac — Apple Silicon
        - Mac — Intel
        - Linux / Raspberry Pi preview
    validations:
      required: true
  - type: input
    id: equipment
    attributes:
      label: Router and extender models
      placeholder: CHR30A + E3200
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Helper version, computer or Pi model, and operating-system version
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What happened?
      description: What does Status or READY say? Are the helper computer's Wi-Fi and Ethernet connected? Which device could not get IPv4?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error or short log excerpt
      description: Do not attach an entire private network log.
